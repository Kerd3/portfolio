<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">EvalForge architecture overview</title>
<desc id="desc">The dashboard sends requests to an Express API. The API reads and writes PostgreSQL and queues jobs in Redis with BullMQ. A worker consumes jobs, calls Mock, Gemini, or OpenAI adapters, grades responses, captures traces, and saves per-case results to PostgreSQL. The API serves run inspection, comparisons, and reliability reports.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101e23"/><stop offset="1" stop-color="#081014"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55d6c2"/><stop offset="1" stop-color="#91e8cb"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".22"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#62d9c5"/></marker>
</defs>
<rect width="1200" height="580" rx="18" fill="url(#bg)"/>
<g fill="#91a6a8" font-family="Arial, sans-serif" font-size="15" letter-spacing="2"><text x="58" y="52">EVALFORGE / SYSTEM ARCHITECTURE</text><text x="1140" y="52" text-anchor="end" font-size="12">SIMPLIFIED COMPONENT VIEW</text></g>
<g stroke="#243d42" stroke-width="1"><path d="M52 80 H1148"/><path d="M52 510 H1148"/></g>
<g filter="url(#shadow)" font-family="Arial, sans-serif">
  <rect x="62" y="235" width="190" height="116" rx="10" fill="#14262c" stroke="#477b78"/>
  <text x="84" y="271" fill="#63dcc5" font-size="12" letter-spacing="1.4">CLIENT</text><text x="84" y="306" fill="#f1f7f5" font-size="23" font-weight="700">Dashboard</text><text x="84" y="330" fill="#a9bcbd" font-size="13">Create and inspect runs</text>

  <rect x="330" y="235" width="190" height="116" rx="10" fill="#14262c" stroke="#477b78"/>
  <text x="352" y="271" fill="#63dcc5" font-size="12" letter-spacing="1.4">HTTP LAYER</text><text x="352" y="306" fill="#f1f7f5" font-size="23" font-weight="700">Express API</text><text x="352" y="330" fill="#a9bcbd" font-size="13">Validate, persist, queue</text>

  <rect x="620" y="128" width="208" height="108" rx="10" fill="#17272c" stroke="#557c81"/>
  <text x="642" y="163" fill="#63dcc5" font-size="12" letter-spacing="1.4">PERSISTENCE</text><text x="642" y="197" fill="#f1f7f5" font-size="22" font-weight="700">PostgreSQL</text><text x="642" y="218" fill="#a9bcbd" font-size="13">Datasets, runs, case results</text>

  <rect x="620" y="354" width="208" height="108" rx="10" fill="#17272c" stroke="#557c81"/>
  <text x="642" y="389" fill="#63dcc5" font-size="12" letter-spacing="1.4">JOB QUEUE</text><text x="642" y="423" fill="#f1f7f5" font-size="22" font-weight="700">Redis + BullMQ</text><text x="642" y="444" fill="#a9bcbd" font-size="13">Background evaluation jobs</text>

  <rect x="920" y="354" width="218" height="108" rx="10" fill="#17272c" stroke="#557c81"/>
  <text x="942" y="389" fill="#63dcc5" font-size="12" letter-spacing="1.4">PROCESSING</text><text x="942" y="423" fill="#f1f7f5" font-size="22" font-weight="700">Worker</text><text x="942" y="444" fill="#a9bcbd" font-size="13">Cases, grading, trace capture</text>

  <rect x="920" y="128" width="218" height="108" rx="10" fill="#17272c" stroke="#557c81"/>
  <text x="942" y="163" fill="#63dcc5" font-size="12" letter-spacing="1.4">MODEL ADAPTERS</text><text x="942" y="197" fill="#f1f7f5" font-size="21" font-weight="700">Mock / Gemini / OpenAI</text><text x="942" y="218" fill="#a9bcbd" font-size="13">Provider response and usage</text>
</g>
<g fill="none" stroke="url(#accent)" stroke-width="3" marker-end="url(#arrow)">
  <path d="M252 293 H320"/>
  <path d="M520 270 H570 V182 H610"/>
  <path d="M520 314 H570 V408 H610"/>
  <path d="M828 408 H910"/>
  <path d="M1029 354 V246"/>
  <path d="M1060 236 V344"/>
  <path d="M920 430 H870 V250 H850 V182 H838"/>
</g>
<g fill="#a9bcbd" font-family="Arial, sans-serif" font-size="12">
  <text x="266" y="280">HTTP</text><text x="536" y="160">read / write</text><text x="536" y="397">enqueue</text><text x="847" y="393">consume jobs</text>
</g>
<g fill="#91a6a8" font-family="Arial, sans-serif" font-size="12"><text x="60" y="548">The worker records per-case outcomes and traces. The API serves run inspection, comparisons, and reliability reports.</text><text x="1140" y="548" text-anchor="end">Node.js · Express · PostgreSQL · Redis · BullMQ</text></g>
</svg>